services:
    postgres:
        image: postgres:16
        environment: 
            POSTGRES_USER: repomaxx
            POSTGRES_PASSWORD: repomaxx
            POSTGRES_DB: repomaxx
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    backend:
        build: ./backend
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: postgres://repomaxx:repomaxx@postgres:5432/repomaxx
        depends_on:
            - postgres
    
volumes:
    postgres_data: